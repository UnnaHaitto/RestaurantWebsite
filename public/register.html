<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      type="module"
      src="../src/features/auth/register/register.js"
      defer
    ></script>
    <link rel="stylesheet" href="./css/style.css" />
    <title>Register page</title>
  </head>
  <body>
    <header>
      <h1>Ravintola listaaja</h1>
      <nav class="header-nav">
        <div class="burger-menu">
          <label for="menu" tabindex="0"> ☰ </label>
          <input id="menu" type="checkbox" />
        </div>
        <ul>
          <li><a href="./main.html">Koti</a></li>
          <li><a href="./map.html">Ravintolat kartalla</a></li>
          <li><a href="./login.html">Kirjaudu sisään</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div id="register-container">
        <h1>Rekisteröidy</h1>
        <form id="register-form">
          <label for="registerUsername">Käyttäjänimi:</label>
          <input type="text" id="registerUsername" name="username" required />
          <p id="usernameError" class="error"></p>
          <label for="registerPassword">Salasana:</label>
          <input
            type="password"
            id="registerPassword"
            name="password"
            required
          />
          <p id="passwordError" class="error"></p>
          <label for="registerMail">Mail:</label>
          <input type="text" id="registerMail" name="mail" required />
          <p id="mailError" class="error"></p>
          <button id="register-button">Rekisteröidy</button>
          <p id="registerError" class="error"></p>
          <a href="./login.html">Omistatko jo käyttäjän? Kirjaudu sisään.</a>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Ravintola Listaaja. Kaikki oikeudet pidätetään.</p>
    </footer>
  </body>
</html>
