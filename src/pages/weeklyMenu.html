<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/weeklyMenu.js" defer></script>
    <title>Weekly Menu</title>
  </head>
  <body>
    <header>
      <h1>Ravintola listaaja</h1>
      <nav class="header-nav">
        <div class="burger-menu">
          <label for="menu" tabindex="0"> ☰ </label>
          <input id="menu" type="checkbox" />
        </div>
        <ul>
          <li><a href="../pages/main.html">Koti</a></li>
          <li><a href="../pages/map.html">Ravintolat kartalla</a></li>
          <li><a href="../pages/login.html">Kirjaudu sisään</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="restaurant-menu-info">
        <h1>Viikon menu</h1>
        <h1 class="restaurant-name">Ravintolan nimi</h1>
      </div>

      <!-- Give the show-menu class to the selected day in javascript-->

      <div id="weekly-menu-container">
        <input type="checkbox" id="day-menu-toggle" />
        <h2 class="month">Kuukausi</h2>
        <label for="day-menu-toggle">
          <h2>Valitse päivä</h2>
        </label>
        <div id="day-container"></div>

        <div class="food-items-container"></div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Ravintola Listaaja. Kaikki oikeudet pidätetään.</p>
    </footer>
  </body>
</html>
